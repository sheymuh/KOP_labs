services:
  webapi:
    container_name: webapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=company_db;Username=postgres;Password=postgres
      - DOTNET_RUNNING_IN_CONTAINER=true
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  employeeapi:
    container_name: employeeapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8082
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=company_db;Username=postgres;Password=postgres
      - Service1__BaseUrl=http://webapi:8080
      - DOTNET_RUNNING_IN_CONTAINER=true
    ports:
      - "8082:8082"
    depends_on:
    - db
    - webapi

  db:
    container_name: postgres-db
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: company_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./seed-data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d company_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: